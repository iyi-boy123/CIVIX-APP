<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIVIX — Live</title><style>
:root{--g:#11633d;--bg:#f5f7f6;--card:#fff;--text:#17221d;--muted:#758179;--line:#e1e8e3}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:15px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}.logo{font-size:22px;font-weight:900;color:var(--g);letter-spacing:1px}.badge{font-size:11px;background:#e6f5ec;color:var(--g);padding:6px 9px;border-radius:20px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:30px 20px}.hero{background:linear-gradient(120deg,#0e3524,#167049);color:white;padding:35px;border-radius:20px;margin-bottom:22px}.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:#c9ddd2;max-width:600px;line-height:1.5}.btn{border:0;background:var(--g);color:white;padding:12px 17px;border-radius:9px;font-weight:800;cursor:pointer}.hero .btn{background:white;color:var(--g)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.stat{font-size:27px;font-weight:900}.muted{color:var(--muted);font-size:12px}.report{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.report h3{font-size:15px;margin:8px 0}.tag{display:inline-block;background:#e8f5ed;color:var(--g);font-size:10px;padding:5px 7px;border-radius:6px;font-weight:800}.status{font-size:10px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.modal{position:fixed;inset:0;background:#10251b99;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modalbox{background:white;border-radius:16px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto}label{font-size:12px;font-weight:800;display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid #d5dfd9;border-radius:8px;font:inherit}textarea{min-height:100px}.close{float:right;border:0;background:#eef2ef;border-radius:50%;width:30px;height:30px;cursor:pointer}.notice{padding:10px;border-radius:8px;background:#eef7f1;color:var(--g);font-size:12px;margin:10px 0}.login{max-width:430px;margin:60px auto}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body>
<header><div class="logo">CIVIX</div><div><span id="api" class="badge">Checking API…</span> <button id="loginBtn" class="btn" style="margin-left:8px">Login</button></div></header>
<main class="wrap">
<section class="hero"><h1>Make your community better.</h1><p>Report bad roads, electricity problems, flooding, waste, broken streetlights and other public issues. CIVIX sends reports to a central system so progress can be tracked.</p><button class="btn" id="reportBtn">＋ Report an issue</button></section>
<div class="grid" id="stats"></div>
<div class="actions"><button class="btn" id="allBtn">Community reports</button><button class="btn" id="mineBtn">My reports</button></div>
<div id="reports" class="grid"></div>
</main>
<div id="modal" class="modal"><div class="modalbox"><button class="close" id="close">×</button><h2 id="modalTitle">Report an issue</h2><div id="message"></div>
<form id="reportForm"><label>Title<input name="title" required placeholder="e.g. Large pothole on Main Street"></label><label>Category<select name="category_id" id="categories" required></select></label><label>Location<input name="location" required placeholder="Ikeja, Lagos"></label><label>Description<textarea name="description" required placeholder="Describe the problem and its impact"></textarea></label><label>Photo<input name="photo" type="file" accept="image/*"></label><button class="btn" style="width:100%">Submit report</button></form>
<div id="loginFormWrap" style="display:none"><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn" style="width:100%">Login</button></form><p class="muted">No account? <button id="registerSwitch" type="button" style="border:0;background:none;color:var(--g);font-weight:800">Register</button></p></div>
</div></div>
<script>
let token=localStorage.getItem("civix_token")||""; let reports=[];
const $=s=>document.querySelector(s);
async function api(path,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization="Bearer "+token;let r=await fetch(path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function boot(){try{await api("/api/health");$("#api").textContent="● API live";}catch{$("#api").textContent="● API offline"}await loadCategories();await loadReports()}
async function loadCategories(){try{let c=await api("/api/categories");$("#categories").innerHTML=c.map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}catch{}}
async function loadReports(){try{reports=await api(token?"/api/me/reports":"/api/reports");render()}catch(e){$("#reports").innerHTML=`<div class="empty">${e.message}</div>`}}
function render(){let counts={total:reports.length,in:reports.filter(x=>x.status==="in_progress").length,res:reports.filter(x=>x.status==="resolved").length};$("#stats").innerHTML=[["Total reports",counts.total],["In progress",counts.in],["Resolved",counts.res]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join("");$("#reports").innerHTML=reports.length?reports.map(r=>`<article class="report"><span class="tag">${r.category}</span><h3>${r.title}</h3><p class="muted">${r.description}</p><p class="muted">📍 ${r.location}</p><span class="status">${r.status.replace("_"," ").toUpperCase()}</span></article>`).join(""):`<div class="empty">No reports yet.</div>`}
$("#reportBtn").onclick=()=>{if(!token){openLogin("Login to report an issue");return}$("#modal").classList.add("open");$("#reportForm").style.display="block";$("#loginFormWrap").style.display="none"};
$("#loginBtn").onclick=()=>openLogin("Login to CIVIX");function openLogin(t){$("#modal").classList.add("open");$("#modalTitle").textContent=t;$("#reportForm").style.display="none";$("#loginFormWrap").style.display="block"}
$("#close").onclick=()=>$("#modal").classList.remove("open");
$("#loginForm").onsubmit=async e=>{e.preventDefault();try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.setItem("civix_token",token);$("#modal").classList.remove("open");$("#loginBtn").textContent="Logged in";loadReports()}catch(e){$("#message").innerHTML=`<div class="notice">${e.message}</div>`}};
$("#registerSwitch").onclick=()=>{let name=prompt("Your name");if(!name)return;let email=prompt("Email");if(!email)return;let password=prompt("Password (6+ characters)");if(!password)return;api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,password})}).then(d=>{token=d.token;localStorage.setItem("civix_token",token);$("#modal").classList.remove("open");$("#loginBtn").textContent="Logged in";loadReports()}).catch(e=>alert(e.message))};
$("#reportForm").onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target);await api("/api/reports",{method:"POST",body:fd});$("#message").innerHTML='<div class="notice">Report submitted successfully.</div>';e.target.reset();setTimeout(()=>{$("#modal").classList.remove("open");loadReports()},700)}catch(e){$("#message").innerHTML=`<div class="notice">${e.message}</div>`}};
$("#allBtn").onclick=async()=>{try{reports=await api("/api/reports");render()}catch(e){alert(e.message)}};$("#mineBtn").onclick=async()=>{if(!token)return openLogin("Login to view your reports");reports=await api("/api/me/reports");render()};
boot();
</script></body></html>
